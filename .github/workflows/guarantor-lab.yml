name: Isolated guarantor UX lab
on:
  pull_request:
    paths: ['prototypes/guarantor-lab/**', '.github/workflows/guarantor-lab.yml']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix frontend
      - run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - run: frontend/node_modules/.bin/playwright test -c prototypes/guarantor-lab/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarantor-lab-screenshots
          path: test-results/
