name: P2P journal PostgreSQL

on:
  pull_request:
  push:
    branches: [main, test/postgres-p2p-ledger, fix/post-audit-core-20261024]

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -r requirements.txt
      - name: SQLite pytest
        run: python -m pytest -q tests --ignore=tests/test_p2p_journal_postgres.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betton
          POSTGRES_PASSWORD: betton_test_only
          POSTGRES_DB: betton_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betton -d betton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGOPTIONS: "-c statement_timeout=15000 -c lock_timeout=10000"
      BETTON_TEST_DATABASE_URL: postgresql+psycopg2://betton:betton_test_only@localhost:5432/betton_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: PostgreSQL full backend and post-audit concurrency regressions
        run: python -m pytest -q tests
