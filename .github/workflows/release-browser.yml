name: Integration browser recovery
on:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.release.config.ts
        working-directory: frontend
      - name: Typecheck and build isolated onboarding prototypes
        run: npx --no-install tsc -p tsconfig.prototypes.json && npx --no-install vite build --config vite.prototypes.config.ts
        working-directory: frontend
      - name: Onboarding directions mobile, language and interaction matrix
        run: npx --no-install playwright test --config playwright.prototypes.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-browser-results
          path: frontend/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-prototype-evidence
          path: |
            .ux-preview/onboarding-screenshots/
            .ux-preview/onboarding-test-results/
            .ux-preview/onboarding-build/
          include-hidden-files: true
          retention-days: 7
