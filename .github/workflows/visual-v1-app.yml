name: Visual V1 actual App evidence
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'app/main.py'
      - 'scripts/ux_v3_preview.py'
      - 'scripts/rich_simulation_pack.py'
      - 'scripts/verify_rich_simulation.py'
      - '.github/workflows/visual-v1-app.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Prepare pinned PR 36 baseline
        run: |
          git worktree add ../visual-v1-before 47f6f4a010ae0ca6fb106d7ba7091dafae7b38cd
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" ../visual-v1-before/frontend/node_modules
      - name: Capture actual App before
        run: node frontend/scripts/capture-app-v1.mjs --root ../visual-v1-before --output qa-app-before --baseline
      - name: Capture actual App after and verify interactions
        timeout-minutes: 5
        run: node frontend/scripts/capture-app-v1.mjs --root . --output qa-app-after
      - name: Verify EVENT and legacy fixtures
        if: ${{ !cancelled() }}
        run: node scripts/verify-visual-v1.mjs
        working-directory: frontend
      - name: Verify guarantor workflows
        if: ${{ !cancelled() }}
        run: node scripts/verify-workflows-v1.mjs
        working-directory: frontend
      - name: Verify chat send, reply, error and legacy behavior
        if: ${{ !cancelled() }}
        run: node scripts/verify-chat-v1.mjs
        working-directory: frontend
      - name: Verify additive SIM creation, 100+ executions and money conservation
        if: ${{ !cancelled() }}
        run: python scripts/verify_rich_simulation.py > rich-sim-check.log 2>&1
      - name: Build actual App for real API screenshots
        if: ${{ !cancelled() }}
        run: npm --prefix frontend run build
      - name: Capture actual App against verified isolated SIM
        timeout-minutes: 3
        if: ${{ !cancelled() }}
        run: node frontend/scripts/capture-rich-sim.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betton-app-v1-before-after
          path: |
            rich-sim-check.log
            qa-rich-sim/
            qa-app-before/*.png
            qa-app-before/report.json
            qa-app-after/*.png
            qa-app-after/report.json
            frontend/visual-v1-qa/
            frontend/qa-visual-v1/pass2/workflows/
            frontend/chat-v1-qa/
          if-no-files-found: error
          retention-days: 14
