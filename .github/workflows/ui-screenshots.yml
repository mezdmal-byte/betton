name: UI screenshots

on:
  push:
    branches:
      - feature/react-full-preview
      - feature/figma-full-implementation
    paths:
      - 'frontend/**'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Storybook
        run: |
          npm run storybook -- --ci --host 127.0.0.1 --port 6006 > /tmp/storybook.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:6006/iframe.html >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/storybook.log
          exit 1

      - name: Capture core UI
        run: node scripts/capture-ui.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: betton-ui-screenshots
          path: frontend/ui-shots/*.png
          if-no-files-found: error
