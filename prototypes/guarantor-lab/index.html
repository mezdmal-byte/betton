<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BetTON — Guarantor Lab</title><style>
:root{--bg:#f6f4ee;--fg:#222f2a;--surface:#fffef9;--line:#d5dad1;--accent:#235b48;--muted:#59685f;--soft:#e8eee7;--danger:#a53535;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}body.dark{--bg:#141e1a;--fg:#edf2e9;--surface:#1c2923;--line:#42564b;--accent:#afd9b5;--muted:#b3c2b6;--soft:#2c4034;--danger:#ffb0a5;color-scheme:dark}button,input,select,textarea{font:inherit}button,select{cursor:pointer;min-height:46px}button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 15px}button:active{transform:translateY(1px)}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.danger{color:var(--danger)}.lab{border-bottom:1px solid var(--line);padding:16px 5vw;display:flex;gap:18px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:-1px;font-size:23px}.caption{font-size:13px;color:var(--muted)}.lab select{max-width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--fg)}.layout{max-width:1080px;margin:30px auto;display:grid;grid-template-columns:240px minmax(0,600px);gap:60px;padding:0 24px}.aside p{color:var(--muted);font-size:14px}.aside button{width:100%;text-align:left;margin:4px 0}.aside button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}main{min-width:0}h1{font:500 36px/1.16 Georgia,serif;letter-spacing:-1.1px;margin:8px 0 20px}h2{font-size:21px;line-height:1.3;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--accent);margin:12px 0}.dot{width:8px;height:8px;background:currentColor;border-radius:50%}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--muted)}.row strong{text-align:right;font-weight:600}.avatar{width:54px;height:54px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:22px Georgia}.person{display:flex;align-items:center;gap:14px}.person p{margin:2px 0}.note{font-size:14px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.actions button{flex:1;min-width:130px}.timeline{list-style:none;padding:0}.timeline li{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.number{border:1px solid var(--line);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none}.timeline .current{color:var(--accent);font-weight:650}.message{padding:14px 18px;background:var(--soft);border-radius:18px 18px 18px 2px;margin:12px 0;max-width:90%;overflow-wrap:anywhere}.message.mine{margin-left:auto;background:var(--accent);color:var(--bg);border-radius:18px 18px 2px 18px}.message small{display:block;font-size:12px;opacity:.8}.compose{display:flex;gap:8px;align-items:start}input,textarea,select.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:12px;min-height:46px}textarea{resize:vertical;min-height:90px}label{display:block;font-weight:600;margin:16px 0 6px}.divider{margin:24px 0;border:0;border-top:1px solid var(--line)}details{margin:16px 0}summary{cursor:pointer;min-height:44px;padding:8px 0;color:var(--accent)}.feedback{padding:12px 16px;background:var(--soft);border-radius:10px;overflow-wrap:anywhere}.dialogue{--accent:#563888;--soft:#eee9f7;--bg:#faf8ff;--fg:#292139;--muted:#655874}.dialogue.dark{--accent:#cfbbff;--soft:#392d4e;--bg:#181320;--fg:#f2edff;--muted:#c4b7d5}.dialogue h1{font-family:system-ui,sans-serif;font-weight:750;font-size:30px}.dialogue .panel{border-radius:8px;border-width:0 0 0 2px;background:var(--soft)}.route{--accent:#9f3f1b;--soft:#f3e6db;--bg:#fcf9f5;--fg:#382d26;--muted:#756355}.route.dark{--accent:#ffb490;--soft:#473328;--bg:#211a16;--fg:#fff1e5;--muted:#c8b4a3}.route .panel{border-radius:0;border:0;border-top:2px solid var(--accent);background:transparent;padding:24px 0}.route h1{font-size:40px}.badge{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:20px}.footer{padding:24px;text-align:center;font-size:13px;color:var(--muted)}#feedback:empty{display:none}p,strong,h1,h2,h3{overflow-wrap:anywhere}.examples{border-top:1px solid var(--line);padding-top:14px;margin-top:24px}.examples select{width:100%}@media(max-width:740px){.layout{display:block;margin:20px auto;padding:0 16px;max-width:600px}.aside{margin-bottom:24px}.aside p{display:none}.aside nav{display:flex;gap:6px;overflow:auto}.aside button{white-space:nowrap;width:auto;flex:none}.lab{padding:12px 16px;gap:10px}.brand{margin-right:auto}.caption{width:100%}h1{font-size:32px}.panel{padding:18px}.row{gap:12px}.aside h2{display:none}.compose{flex-wrap:wrap}.compose button{width:100%}}@media(prefers-reduced-motion:no-preference){main{animation:appear .18s ease-out}@keyframes appear{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header class="lab"><span class="brand">betton / lab</span><button id="theme" aria-label="Переключить тему">Тёмная тема</button><span class="caption">Самостоятельный UX-эксперимент · синтетические данные · без сервера и денежных операций</span></header><div class="layout"><aside class="aside"><h2>Три подхода</h2><nav id="directions"></nav><p id="why"></p><div class="examples"><label for="scenario">Проверить состояние</label><select id="scenario"></select><label for="role">Демонстрационная роль</label><select id="role"><option value="creator">Создатель</option><option value="guarantor">Гарант</option></select><button id="reset">Начать заново</button></div></aside><main id="app"></main></div><footer class="footer">Локальная модель интерфейса, не подключена к BetTON. <a href="research.md">Источники и ограничения</a></footer><script>
const $=s=>document.querySelector(s), names=['Соглашение','Диалог','Маршрут'], labels=['Новое пари','Выбор гаранта','Приглашение','Переговоры','Создатель подтвердил','Сбор обеспечения','Обеспечено','Проверка результата','Результат','Отказ гаранта','Истёк срок приглашения','Отмена и возврат','Неизвестный ответ','Редакция изменилась','Пустая переписка'];let direction=0,step=3,rev=2,role='creator',agreed=false,selected='Мария',fee=5,mode='fixed',percent=2,messages=[],feedback='',title='Запуск состоится до пятницы?',draft='',decision='Да';
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(n){step=n;feedback='';render();$('#app').focus({preventScroll:true})}function btn(text,action,primary=false){return `<button ${primary?'class="primary"':''} data-action="${action}">${text}</button>`}function person(){return `<div class="person"><span class="avatar" aria-hidden="true">${selected==='Мария'?'М':'А'}</span><div><h3>${safe(selected)} · гарант</h3><p class="note">Тестовый профиль, без реального рейтинга</p></div></div>`}function rows(){return `<div class="row"><span>Вознаграждение за событие</span><strong>${mode==='fixed'?fee+' TON':mode==='percent'?percent+'% прибыли':mode==='combined'?fee+' TON + '+percent+'%':percent+'%, минимум '+fee+' TON'}</strong></div><div class="row"><span>Редакция условий</span><strong>№ ${rev}</strong></div><div class="row"><span>Окончание события</span><strong>30 октября, 18:00 UTC</strong></div><div class="row"><span>Решение гаранта</span><strong>До 31 октября, 18:00 UTC</strong></div>`}function terms(){return `<details><summary>Условия и финансовые последствия</summary><p>Исход «Да»: опубликован официальный анонс запуска до 30 октября, 18:00 UTC. Иначе — «Нет». Основание — публикация организатора.</p>${rows()}<p class="note">Вознаграждение единое за событие, удерживается из прибыли выигравшей стороны, а не с каждого победителя целиком. Сервисный сбор — 1% прибыли. После удержаний победителям должно остаться не менее 20% прибыли. Обеспечение проверяется по обоим исходам.</p><p class="note">Гарант не участвует в ставках. Своевременное решение окончательное. При отмене вознаграждение не выплачивается. Итоговые суммы и доступность действий определяет сервер.</p></details>`}function chat(){return `<h2>Обсуждение</h2>${step===14?'<p class="note">Сообщений пока нет. Уточните источник результата или предложите тариф.</p>':`<div class="message"><small>${safe(selected)} · гарант · 14:02</small>Проверю результат по официальному анонсу. Предлагаю фиксированные 5 TON за событие.</div>`}${messages.map(m=>`<div class="message mine"><small>${safe(m.role)} · демонстрация</small>${safe(m.text)}</div>`).join('')}<form id="chat"><label for="message">Сообщение</label><div class="compose"><textarea id="message" maxlength="4000" placeholder="Уточнить условия…" required>${safe(draft)}</textarea><button>Отправить</button></div></form><p class="note">Переписка не заменяет подтверждение редакции условий.</p>`}function summary(){return `<div class="panel">${person()}${rows()}${terms()}</div>`}function timeline(){return `<ol class="timeline">${['Пригласить гаранта','Согласовать условия','Обеспечить оба исхода','Дождаться события','Получить решение'].map((v,i)=>`<li class="${i===Math.min(4,Math.max(0,step-2))?'current':''}"><span class="number">${i+1}</span><span>${v}</span></li>`).join('')}</ol>`}function render(){document.body.classList.toggle('dialogue',direction===1);document.body.classList.toggle('route',direction===2);$('#directions').innerHTML=names.map((n,i)=>`<button aria-pressed="${direction===i}" data-dir="${i}">${n}${i===0?' · выбор':''}</button>`).join('');$('#why').textContent=['Рекомендовано: условия, версия и следующий шаг видны прежде переписки. Меньше риска принять устаревшее предложение.','Переговоры ведут сценарий. Удобно обсуждать, но финансовые условия легче потерять среди сообщений.','Весь жизненный цикл перед глазами. Хорош для первого знакомства, но медленнее для повторных переговоров.'][direction];$('#scenario').innerHTML=labels.map((v,i)=>`<option value="${i}" ${i===step?'selected':''}>${v}</option>`).join('');let content='';
if(step===0)content=`<h1>О чём ваше пари?</h1><p class="note">Частное событие с гарантом. Доступ участникам — по приглашению, ставки работают по P2P.</p><form id="create"><label for="question">Проверяемый вопрос</label><textarea id="question" minlength="8" maxlength="512" required>${safe(title)}</textarea><label for="criteria">Как определить результат</label><textarea id="criteria" required>По официальному анонсу организатора до 30 октября, 18:00 UTC.</textarea><p>Два исхода: «Да» и «Нет»</p><p class="note">В полном продукте здесь также обязательны источник, критерии обоих исходов и сроки. Даты и исходы этого прототипа фиксированы.</p><button class="primary">Выбрать гаранта</button></form>`;
else if(step===1)content=`<h1>Кто проверит результат?</h1><p>Выберите гаранта. Приглашение ещё не означает согласие.</p>${['Мария','Алексей'].map(n=>`<div class="panel"><h2>${n}</h2><p>Синтетический профиль · проверка публичных источников</p><p class="note">Обсуждает все четыре тарифа. Окончательное предложение появится в переговорах.</p><button data-person="${n}">Посмотреть и пригласить</button></div>`).join('')}`;
else if(step===2)content=`<h1>Приглашение отправлено</h1>${summary()}<p class="feedback">Гаранту даётся 1 минута на отклик. Пока он не ответил, соглашения нет.</p><div class="actions">${btn('Показать отклик гаранта','reply',true)}${btn('Показать отказ','decline')}</div><p class="note">Кнопки ниже и переключение роли — управление демонстрацией, не действия от чужого имени.</p>`;
else if(step===3||step===14){let offer=`<div class="panel"><div class="status"><span class="dot"></span>На согласовании · редакция ${rev}</div>${person()}${rows()}<p class="note">Пять минут на обсуждение после отклика. Продление ещё на пять минут требует согласия обоих.</p><div class="actions">${btn(role==='creator'?'Подтвердить эту редакцию':'Подтвердить тариф','confirm',true)}${btn('Встречное предложение','counter')}</div>${terms()}</div>`;content=`<h1>${direction===1?'Договоритесь с '+safe(selected):'Проверьте предложение'}</h1>${direction===1?chat()+offer:direction===2?timeline()+offer+chat():offer+chat()}<details><summary>Изменить правила пари</summary><p>Изменение правил создаст новую редакцию и сбросит согласование тарифа.</p>${btn('Создать новую редакцию правил','edit')}</details><div class="actions">${btn('Запросить продление','extend')}${btn('Кто может отменить пари','cancel')}</div>`}
else if(step===4)content=`<h1>Теперь очередь гаранта</h1>${summary()}<p class="feedback">Создатель подтвердил редакцию ${rev}. Гарант должен принять эту же редакцию. До этого сбор обеспечения не начался.</p><div class="actions">${role==='guarantor'?btn('Принять и начать сбор','accept',true):btn('Перейти к роли гаранта','switch')}</div>`;
else if(step===5||step===6)content=`<h1>${step===5?'Соглашение есть. Нужны сделки.':'Оба исхода обеспечены'}</h1><p class="note">Согласовано создателем и гарантом · редакция ${rev}</p><div class="panel"><h2>Обеспечение вознаграждения</h2><div class="row"><span>Если победит «Да»</span><strong>Обеспечено</strong></div><div class="row"><span>Если победит «Нет»</span><strong>${step===5?'Ещё недостаточно':'Обеспечено'}</strong></div><p>Обеспечение формируется исполненными P2P-сделками. Неисполненное предложение само по себе фонд не обеспечивает.</p><p class="note">Если к окончанию приёма фонд не сформирован — отмена и возврат, без оплаты гаранту. Гарант не пополняет фонд отдельным платежом.</p></div>${terms()}<div class="actions">${btn(step===5?'Демо: оба исхода обеспечены':'Демо: событие завершилось',step===5?'fund':'end',true)}${btn('Условия отмены','cancel')}</div>`;
else if(step===7)content=`<h1>Время проверить результат</h1>${summary()}<p>Решение доступно гаранту после окончания события и до 31 октября, 18:00 UTC. Если решения не будет в течение 24 часов — отмена с возвратом.</p>${role==='guarantor'?`<form id="decide"><label for="outcome">Подтверждённый исход</label><select class="field" id="outcome"><option>Да</option><option>Нет</option></select><label for="reason">Основание решения</label><textarea id="reason" required>Официальный анонс опубликован до указанного срока.</textarea><p class="note">Своевременное решение окончательное. В UX v3 нет обычной апелляции через модератора.</p><button class="primary">Проверить перед решением</button></form>`:btn('Перейти к роли гаранта','switch',true)}<div class="actions">${btn('Демо: срок решения истёк','timeout')}</div>`;
else if(step===8)content=`<h1>Результат подтверждён</h1><div class="status"><span class="dot"></span>Демонстрация завершённого расчёта</div><p>В этом примере победил исход «${safe(decision)}». Основание: официальный анонс. Решение гаранта окончательное.</p><div class="panel"><h2>Пример выплаты победителю</h2><div class="row"><span>Вложено</span><strong>100 TON</strong></div><div class="row"><span>Выплата до удержаний</span><strong>200 TON</strong></div><div class="row"><span>Прибыль до удержаний</span><strong>100 TON</strong></div><div class="row"><span>Сервисный сбор · 1%</span><strong>−1 TON</strong></div><div class="row"><span>Доля вознаграждения гаранта</span><strong>−5 TON</strong></div><div class="row"><span>К зачислению</span><strong>194 TON</strong></div></div><p class="note">Отдельный фиксированный пример для одного победителя и тарифа 5 TON, не расчёт текущего предложения. 200 − 1 − 5 = 194; чистая прибыль 94 из 100 TON, больше минимума 20%. В реальном пари журнал сервера распределяет единое вознаграждение между победителями.</p>`;
else if(step===9||step===10)content=`<h1>${step===9?'Гарант отказался':'Время приглашения истекло'}</h1><p>Соглашение не заключено. Можно пригласить другого гаранта. Новая редакция потребует нового согласования.</p><div class="actions">${btn('Выбрать другого гаранта','choose',true)}</div>`;
else if(step===11)content=`<h1>Пари отменено</h1><p>Вознаграждение гаранту не начисляется. При расчёте отмены возвращаются средства по действующим правилам; итоги отражает серверный журнал.</p><div class="panel"><h2>Без неопределённости</h2><p>Невыполненные предложения освобождаются, исполненные позиции возвращаются при отмене. Синтетический экран: реальных возвратов не было.</p></div>${btn('Новое демо-пари','restart')}`;
else if(step===12)content=`<h1>Ответ не получен</h1><p>Сеть оборвалась. Это не означает, что действие не выполнено.</p><p class="feedback">Сохраняем исходный идентификатор. Сначала запрашиваем состояние, не отправляем новое приглашение или подтверждение.</p>${btn('Демо: проверить результат','lookup',true)}<p class="note">В этом автономном прототипе серверного запроса нет. Для интеграции требуется owned lookup и тот же ключ повторной операции.</p>`;
else content=`<h1>Условия уже изменились</h1><p>Вы смотрели редакцию ${rev-1}. Подтверждение устаревшей версии запрещено.</p><p class="feedback">Покажем новую редакцию и изменения. Предыдущее подтверждение не переносится автоматически.</p>${btn('Открыть актуальные условия','reply',true)}`;
$('#app').innerHTML=`<div id="feedback" role="status" aria-live="polite" class="feedback">${safe(feedback)}</div>${step!==0?'<p class=note>Частное пари · '+safe(title)+'</p>':''}${content}`;$('#app').tabIndex=-1;bind()}
function bind(){document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{direction=+b.dataset.dir;render()});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{selected=b.dataset.person;rev++;go(2)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='reply')go(3);if(a==='decline')go(9);if(a==='choose')go(1);if(a==='confirm'){if(role==='creator')go(4);else{feedback='Тариф подтверждён гарантом. Теперь создатель должен подтвердить эту редакцию.';render()}}if(a==='switch'){role=role==='creator'?'guarantor':'creator';$('#role').value=role;render()}if(a==='accept')go(5);if(a==='fund')go(6);if(a==='end')go(7);if(a==='restart'){messages=[];go(0)}if(a==='lookup'){feedback='Демонстрация: приглашение найдено по исходному ключу. Повтор не создан.';step=2;render()}if(a==='edit'){rev++;fee=0;mode='fixed';feedback='Правила изменены: подтверждения и тариф сброшены. Согласуйте новую редакцию.';step=3;render()}if(a==='extend'){feedback='Запрошено продление. Срок изменится только после согласия второй стороны.';render()}if(a==='timeout')go(11);if(a==='cancel'){feedback='Отмена доступна назначенному гаранту после события в пределах 24 часов с указанием причины. Создатель не может отменить пари этой кнопкой. Автоотмена — при отсутствии обеспечения или решения в срок.';render()}if(a==='counter')counter()});if($('#chat'))$('#chat').onsubmit=e=>{e.preventDefault();let t=$('#message').value.trim();if(!t)return;messages.push({role:role==='creator'?'Создатель':selected,text:t});draft='';render();$('#message').focus()};if($('#create'))$('#create').onsubmit=e=>{e.preventDefault();title=$('#question').value.trim();go(1)};if($('#decide'))$('#decide').onsubmit=e=>{e.preventDefault();decision=$('#outcome').value;if(confirm('Демонстрация окончательного решения. После реального подтверждения пересмотр недоступен. Продолжить?'))go(8)}}
function counter(){$('#app').innerHTML=`<h1>Предложить другой тариф</h1><p>Новое предложение создаст редакцию ${rev+1}. Подтверждения прошлой редакции сбросятся.</p><form id="tariff"><label for="mode">Тариф</label><select id="mode" class="field"><option value="fixed">Фиксированная сумма</option><option value="percent">Процент от прибыли</option><option value="combined">Процент + фиксированная сумма</option><option value="percent_minimum">Процент, но не меньше суммы</option></select><label for="fixed">Фиксированная сумма / минимум, TON</label><input id="fixed" type="number" min="0" max="1000000" step="0.01" value="5" required><label for="percent">Процент, %</label><input id="percent" type="number" min="0" max="100" step="0.01" value="2" required><p class="note">F; P × g; F + P × g; max(F, P × g). P — прибыль победившей стороны до удержаний. Сервер отдельно проверяет обеспечение и сохранение минимум 20% прибыли.</p><div class="actions"><button class="primary">Отправить предложение</button><button type="button" id="back">Вернуться без изменений</button></div></form>`;$('#back').onclick=()=>render();$('#tariff').onsubmit=e=>{e.preventDefault();mode=$('#mode').value;fee=+$('#fixed').value;percent=+$('#percent').value;rev++;feedback='Встречное предложение сохранено только в демо. Нужны подтверждения новой редакции.';step=3;render()};$('#mode').onchange=()=>{let m=$('#mode').value;$('#fixed').disabled=m==='percent';$('#percent').disabled=m==='fixed'};$('#mode').dispatchEvent(new Event('change'))}
$('#theme').onclick=()=>{document.body.classList.toggle('dark');$('#theme').textContent=document.body.classList.contains('dark')?'Светлая тема':'Тёмная тема'};$('#scenario').onchange=()=>go(+$('#scenario').value);$('#role').onchange=()=>{role=$('#role').value;render()};$('#reset').onclick=()=>{messages=[];rev=1;fee=5;mode='fixed';role='creator';$('#role').value=role;go(0)};render();
</script></html>
