<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>BetTON</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b30;
      --text: #f4f1ea;
      --muted: #9aa3b8;
      --gold: #d4af37;
      --yes: #3dd68c;
      --no: #ff6b6b;
      --line: #2a334d;
      --chip: #1c243f;
      --input-bg: #12182a;
      --input-fg: #f4f1ea;
      --input-ph: #c5cddc;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    header {
      padding: 14px 16px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand { margin: 0; font-size: 1.05rem; letter-spacing: .16em; font-weight: 800; }
    .who { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .admin-mark {
      display: inline-block;
      margin-left: 6px;
      background: var(--gold);
      color: #111;
      border-radius: 999px;
      padding: 1px 8px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .balance-wrap { text-align: right; }
    .balance-label { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; }
    .balance { color: var(--gold); font-weight: 800; font-size: 1.2rem; }
    .tabs {
      display: flex;
      gap: 6px;
      padding: 0 16px 8px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 2;
    }
    .tab {
      flex: 1;
      min-height: 44px;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--muted);
      border-radius: 12px;
      font-weight: 700;
    }
    .tab.active { background: var(--gold); color: #111; border-color: var(--gold); }
    main { padding: 0 16px 80px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin: 12px 0;
    }
    .card { color: var(--text); }
    .question {
      color: var(--text);
      -webkit-text-fill-color: var(--text);
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .meta { color: var(--muted); font-size: .8rem; margin: 8px 0 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      background: var(--chip);
      border-radius: 999px;
      padding: 2px 8px;
    }
    label { display: block; color: var(--muted); font-size: .8rem; margin: 8px 0 4px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--input-fg);
      -webkit-text-fill-color: var(--input-fg);
      caret-color: var(--input-fg);
      border-radius: 12px;
      padding: 12px 12px;
      font-size: 16px;
      min-height: 44px;
      color-scheme: dark;
    }
    input::placeholder, textarea::placeholder {
      color: var(--input-ph);
      -webkit-text-fill-color: var(--input-ph);
      opacity: 1;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 12px;
      min-height: 44px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: .45; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row > * { flex: 1; min-width: 0; }
    .gold { background: var(--gold); color: #111; }
    .yes { background: var(--yes); color: #062016; }
    .no { background: var(--no); color: #2a0a0a; }
    .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .muted { color: var(--muted); font-size: .85rem; line-height: 1.4; }
    .err { color: var(--no); font-size: .85rem; min-height: 1.2em; }
    .odds {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .odd {
      flex: 1 1 28%;
      min-width: 92px;
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--line);
    }
    .odd b { display: block; font-size: 1.45rem; letter-spacing: .02em; }
    .odd .kname { font-size: .85rem; font-weight: 800; overflow-wrap: anywhere; }
    .odd .pct { color: var(--muted); font-size: .75rem; margin-top: 2px; }
    .c0 .kname, .c0 b { color: var(--yes); }
    .c1 .kname, .c1 b { color: var(--no); }
    .c2 .kname, .c2 b { color: var(--gold); }
    .preview { color: var(--muted); font-size: .8rem; min-height: 2.4em; margin-top: 8px; line-height: 1.35; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .chip {
      min-height: 44px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--muted);
      font-size: .9rem;
    }
    .chip.on { background: var(--gold); color: #111; border-color: var(--gold); }
    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      background: #1f2a18;
      color: var(--yes);
      border: 1px solid #2f5a38;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      display: none;
      z-index: 5;
    }
    .toast.show { display: block; }
    .toast.bad { background: #2a1414; color: var(--no); border-color: #5a2f2f; }
    h2 { font-size: .95rem; margin: 18px 0 0; }
    .outcome-row {
      display: grid;
      grid-template-columns: 1fr 88px 64px 40px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .outcome-row .pct { color: var(--muted); font-size: .8rem; text-align: right; }
    .rm {
      min-height: 40px;
      padding: 0;
      background: transparent;
      color: var(--no);
      border: 1px solid var(--line);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 class="brand">BetTON</h1>
      <div class="who" id="who">Подключение…</div>
    </div>
    <div class="balance-wrap">
      <div class="balance-label">Баланс</div>
      <div class="balance" id="balance">—</div>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="feed">Лента</button>
    <button class="tab" data-tab="create">Создать</button>
    <button class="tab" data-tab="mine">Мои</button>
    <button class="tab" id="moderation-tab" data-tab="moderation" hidden>Модерация</button>
  </nav>
  <main>
    <p class="err" id="error"></p>

    <section data-panel="feed">
      <div class="chips" id="cat-filters">
        <button class="chip on" data-cat="">Все</button>
        <button class="chip" data-cat="sport">Спорт</button>
        <button class="chip" data-cat="politics">Политика</button>
        <button class="chip" data-cat="unique">Уникальное</button>
      </div>
      <div class="chips" id="status-filters">
        <button class="chip on" data-status="">Все</button>
        <button class="chip" data-status="open">Открытые</button>
        <button class="chip" data-status="closed">Стоп</button>
        <button class="chip" data-status="resolved">Рассчитаны</button>
      </div>
      <div id="markets"></div>
    </section>

    <section data-panel="create" hidden>
      <div class="card">
        <strong>Новый рынок</strong>
        <label>Вопрос</label>
        <input id="question" maxlength="512" placeholder="Кто победит в матче?"/>
        <label>Категория</label>
        <div class="chips" id="create-cats">
          <button type="button" class="chip" data-cat="sport">Спорт</button>
          <button type="button" class="chip" data-cat="politics">Политика</button>
          <button type="button" class="chip on" data-cat="unique">Уникальное</button>
        </div>
        <label>Два исхода</label>
        <div id="outcomes-editor"></div>
        <p class="muted">Событие появится после проверки админом. Залог не нужен. Условия ставок задают игроки.</p>
        <label>Конец приёма ставок</label>
        <input id="close-at" type="datetime-local" required/>
        <div class="row">
          <button class="gold" id="create">Создать рынок</button>
        </div>
      </div>
    </section>

    <section data-panel="mine" hidden>
      <h2>Созданные</h2>
      <div id="mine-created"></div>
      <h2>Мои заявки</h2>
      <div id="mine-orders"></div>
      <h2>Мои ставки</h2>
      <div id="mine-bets"></div>
      <h2>Результаты</h2>
      <div id="mine-results"></div>
    </section>
    <section data-panel="moderation" hidden><h2>На проверке</h2><div id="moderation-markets"></div></section>
  </main>
  <div class="toast" id="toast"></div>

  <script src="/static/p2p.js"></script>
  <script>
    const CAT_LABEL = { sport: "Спорт", politics: "Политика", unique: "Уникальное" };
    const OPEN_IN_TG = "Откройте BetTON через Telegram";
    const AUTH_REOPEN = "Сессия недействительна. Закройте Mini App и откройте его заново";
    const tg = window.Telegram && window.Telegram.WebApp;
    try {
      if (tg) {
        tg.ready();
        tg.expand();
        // Не перекрашивать фон/карточки из themeParams: светлая тема Telegram
        // делает название пари того же цвета, что и карточка.
      }
    } catch (e) { /* браузер без Telegram */ }

    function getInitData() {
      return (tg && typeof tg.initData === "string" && tg.initData) ? tg.initData : "";
    }

    const inTelegram = !!getInitData();

    let me = null;
    let authBlocked = false;
    let filterCategory = "";
    let filterStatus = "";
    let createCategory = "unique";
    const quoteTimers = {};
    let myPositions = {};
    let createOutcomes = [
      { name: "Да", k: 2 },
      { name: "Нет", k: 2 }
    ];

    function showError(e) {
      document.getElementById("error").textContent = e || "";
    }

    function toast(msg, bad) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.toggle("bad", !!bad);
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2800);
    }

    function displayName() {
      const unsafe = inTelegram && tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (unsafe && (unsafe.first_name || unsafe.username)) {
        return unsafe.first_name || unsafe.username;
      }
      return (me && me.username) || "игрок";
    }

    function odds(p) {
      if (!p || p <= 0) return 0;
      return 1 / p;
    }

    function fmtK(p) { return odds(p).toFixed(2); }
    function fmtPct(p) { return (p * 100).toFixed(1) + "%"; }
    function fmtTon(v) { return Number(v).toFixed(2) + " TON"; }

    function statusLabel(s) {
      if (s === "pending") return "На модерации";
      if (s === "rejected") return "Отклонено";
      if (s === "open") return "Открыт";
      if (s === "closed") return "Приём закрыт";
      return "Рассчитан";
    }

    function marketOutcomes(m) {
      if (m.outcomes && m.outcomes.length) return m.outcomes;
      return ["Да", "Нет"];
    }

    function marketPrices(m) {
      if (m.prices && m.prices.length) return m.prices;
      return [m.price_yes || 0.5, m.price_no || 0.5];
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function toLocalInput(d) {
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
        "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }

    function defaultCloseAt() {
      const d = new Date(Date.now() + 24 * 3600 * 1000);
      return toLocalInput(d);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function apiError(data, status) {
      const d = data && data.detail;
      if (status === 401) return AUTH_REOPEN;
      if (typeof d === "string") return d;
      if (status === 403) return "Недостаточно прав";
      if (status === 404) return "Не найдено";
      return "Ошибка запроса";
    }

    function isAuthReopenError(e) {
      return !!(e && e.message === AUTH_REOPEN);
    }

    function applyUnauthorized() {
      authBlocked = true;
      me = null;
      myPositions = {};
      paintUser();
      for (const id of ["mine-created", "mine-bets", "mine-results", "mine-orders", "moderation-markets"]) document.getElementById(id).innerHTML = "";
      showError(AUTH_REOPEN);
    }

    async function api(path, options) {
      options = options || {};
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      const initData = getInitData();
      if (initData) headers["Authorization"] = "tma " + initData;
      const res = await fetch(path, Object.assign({}, options, { headers }));
      if (res.status === 401) {
        applyUnauthorized();
        throw new Error(AUTH_REOPEN);
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(apiError(data, res.status));
      return data;
    }

    function paintUser() {
      const admin = me && me.is_admin;
      document.getElementById("moderation-tab").hidden = !admin;
      document.getElementById("who").innerHTML =
        escapeHtml(displayName()) +
        (admin ? '<span class="admin-mark">админ</span>' : "");
      document.getElementById("balance").textContent = me ? fmtTon(me.balance) : "—";
      const lock = document.getElementById("lock");
      if (lock && me) lock.max = String(me.balance);
      const createBtn = document.getElementById("create");
      if (createBtn) createBtn.disabled = !me;
    }

    function requireLogin() {
      if (!inTelegram) throw new Error(OPEN_IN_TG);
      if (!me || authBlocked) throw new Error(AUTH_REOPEN);
    }

    async function auth() {
      if (!inTelegram || authBlocked) {
        throw new Error(inTelegram ? AUTH_REOPEN : OPEN_IN_TG);
      }
      me = await api("/auth/telegram", { method: "POST", body: "{}" });
      paintUser();
    }

    async function refreshMe() {
      if (!me || authBlocked) return;
      const updated = await api("/users/" + me.id);
      if (authBlocked) return;
      me = updated;
      paintUser();
    }

    function setBalance(v) {
      me.balance = v;
      paintUser();
    }

    async function loadPositionsMap() {
      if (!me) {
        myPositions = {};
        return;
      }
      try {
        const rows = await api("/users/" + me.id + "/positions");
        myPositions = {};
        for (const p of rows) myPositions[p.market_id] = p;
      } catch (e) {
        myPositions = {};
        if (isAuthReopenError(e)) throw e;
      }
    }

    function renderOutcomesEditor() {
      document.getElementById("outcomes-editor").innerHTML = createOutcomes.map((o,i) =>
        `<input class="oname" data-i="${i}" value="${escapeHtml(o.name)}" placeholder="Исход ${i+1}"/>`).join("");
    }
    function syncOutcomesFromDom() {
      document.querySelectorAll("#outcomes-editor .oname").forEach(input => {
        createOutcomes[Number(input.dataset.i)].name = input.value;
      });
    }

    function marketCard(m) {
      if (m.mechanism === "p2p") return p2pCard(m);
      const names = marketOutcomes(m);
      const prices = marketPrices(m);
      const accepting = !!m.accepting_bets;
      const resolved = m.status === "resolved";
      const canAdminAct = me && me.is_admin && !resolved;
      const canStop = canAdminAct && m.status === "open" && accepting;
      const canResolve = canAdminAct && (m.status === "closed" || (m.status === "open" && !accepting));
      const pos = myPositions[m.id];
      const shares = pos && (pos.shares && pos.shares.length ? pos.shares : [pos.shares_yes || 0, pos.shares_no || 0]);
      const isAuto = m.settlement_kind === "auto";
      const canClaim = resolved && !isAuto && pos && !pos.claimed && shares && shares.some(x => x > 0);
      const canResidual = resolved && !isAuto && me && me.is_admin && (m.pot || 0) > 0.0001;
      const oddsHtml = names.map((name, i) => `
        <div class="odd c${i % 3}">
          <div class="kname">${escapeHtml(name)}</div>
          <b>${fmtK(prices[i] || 0)}</b>
          <div class="pct">${fmtPct(prices[i] || 0)}</div>
        </div>`).join("");
      const buyBtns = names.map((name, i) =>
        `<button class="${i === 1 ? "no" : "yes"}" data-act="buy" data-outcome="${i}">Поставить «${escapeHtml(name)}»</button>`
      ).join("");
      const resolveBtns = names.map((name, i) =>
        `<button class="ghost" data-act="resolve" data-outcome="${i}" data-label="${escapeHtml(name)}">Рассчитать: ${escapeHtml(name)}</button>`
      ).join("");
      return `
        <div class="card" data-id="${m.id}" data-status="${m.status}">
          <div class="question">${escapeHtml(m.question)}</div>
          <div class="meta">
            <span class="pill">${statusLabel(m.status)}</span>
            <span class="pill">${escapeHtml(CAT_LABEL[m.category] || "Уникальное")}</span>
            <span class="pill">банк ${fmtTon(m.pot || 0)}</span>
            ${m.close_at ? `<span class="pill">до ${escapeHtml(String(m.close_at).replace("T", " ").slice(0, 16))} UTC</span>` : ""}
            ${resolved && m.winning_outcome ? `<span class="pill">Исход: ${escapeHtml(m.winning_outcome)}</span>` : ""}
          </div>
          ${moderationActions(m)}
          ${m.status === "rejected" ? `<p class="muted">Отклонено: ${escapeHtml(m.rejection_reason || "")} · залог возвращён</p>` : ""}
          <div class="odds">${oddsHtml}</div>
          ${accepting ? `
            <label>Сумма ставки TON</label>
            <input type="number" min="1" step="1" value="10" class="amount" inputmode="decimal"/>
            <div class="preview" data-preview>Введите сумму — покажем доли и средний коэф</div>
            <div class="row" style="flex-wrap:wrap">${buyBtns}</div>` : ""}
          ${canStop ? `
            <div class="row">
              <button class="ghost" data-act="close">Стоп ставки</button>
            </div>` : ""}
          ${canResolve ? `<div class="row" style="flex-wrap:wrap">${resolveBtns}</div>` : ""}
          ${canClaim ? `
            <p class="muted" style="margin-top:8px">комиссия 1% с прибыли: 75% создателю, 25% платформе</p>
            <div class="row">
              <button class="gold" data-act="claim">Забрать выигрыш</button>
            </div>` : ""}
          ${canResidual ? `
            <div class="row">
              <button class="ghost" data-act="residual">Забрать остаток залога</button>
            </div>` : ""}
          ${resolved && pos && pos.claimed && !isAuto ? `<p class="muted">Выигрыш уже получен${pos.tip_paid ? " · комиссия " + Number(pos.tip_paid).toFixed(2) + " TON" : ""}</p>` : ""}
        </div>`;
    }

    function positionCard(pos) {
      const m = pos.market;
      const resolved = m.status === "resolved";
      const names = marketOutcomes(m);
      const shares = pos.shares && pos.shares.length ? pos.shares : [pos.shares_yes || 0, pos.shares_no || 0];
      const lines = m.mechanism === "p2p"
        ? names.map((n,i) => Number(pos.costs?.[i] || 0) > 0
          ? escapeHtml(n)+": ставка "+fmtTon(pos.costs[i])+" @"+(shares[i]/pos.costs[i]).toFixed(2)+" · выплата при победе "+fmtTon(shares[i]) : "").filter(Boolean).join(" · ")
        : names.map((n, i) => escapeHtml(n) + ": " + Number(shares[i] || 0).toFixed(2) + " долей").join(" · ");
      const winningIndex = names.indexOf(m.winning_outcome);
      const lost = resolved && winningIndex >= 0 && Number(shares[winningIndex] || 0) <= 0;
      const canClaim = resolved && m.settlement_kind !== "auto" && !pos.claimed && !lost && shares.some(x => x > 0);
      return `
        <div class="card" data-id="${m.id}" data-status="${m.status}">
          <div class="question">${escapeHtml(m.question)}</div>
          <div class="meta">
            <span class="pill">${statusLabel(m.status)}</span>
            ${resolved && m.winning_outcome ? `<span class="pill">Исход: ${escapeHtml(m.winning_outcome)}</span>` : ""}
          </div>
          <p class="muted">${lines}</p>
          ${canClaim ? `
            <p class="muted">комиссия 1% с прибыли: 75% создателю, 25% платформе</p>
            <div class="row">
              <button class="gold" data-act="claim">Забрать выигрыш</button>
            </div>` : ""}
          ${lost ? `<p class="muted">Проигрыш</p>` : ""}
          ${resolved && !lost && pos.claimed && m.settlement_kind !== "auto" ? `<p class="muted">Выигрыш уже получен${pos.tip_paid ? " · комиссия " + Number(pos.tip_paid).toFixed(2) + " TON" : ""}</p>` : ""}
        </div>`;
    }

    function settlementCard(s) {
      const loss = !!s.is_loss;
      const when = s.resolved_at ? escapeHtml(String(s.resolved_at).replace("T", " ").slice(0, 16)) + " UTC" : "";
      const chosen = (s.chosen_outcomes && s.chosen_outcomes.length)
        ? s.chosen_outcomes.map(escapeHtml).join(", ")
        : "нет ставок";
      const creatorBits = (s.lock_ton > 0 || s.residual_returned > 0)
        ? `<p class="muted">залог ${fmtTon(s.lock_ton)} · возврат остатка ${fmtTon(s.residual_returned)}</p>`
        : "";
      return `
        <div class="card" data-id="${s.market_id}">
          <div class="question">${escapeHtml(s.question)}</div>
          <div class="meta">
            <span class="pill">${loss ? "Проигрыш" : "Расчёт"}</span>
            <span class="pill">Исход: ${escapeHtml(s.winning_outcome || "")}</span>
            ${when ? `<span class="pill">${when}</span>` : ""}
          </div>
          <p class="muted">ставки: ${escapeHtml(chosen)}</p>
          <p class="muted">сумма ставок ${fmtTon(s.stakes_total)} · выплата ${fmtTon(s.payout)} · чаевые ${fmtTon(s.tip)}</p>
          <p class="muted">зачислено ${fmtTon(s.credited)} · результат ${fmtTon(s.result)}</p>
          ${creatorBits}
        </div>`;
    }

    async function loadMarkets() {
      await loadPositionsMap();
      const qs = new URLSearchParams();
      if (filterCategory) qs.set("category", filterCategory);
      if (filterStatus) qs.set("status", filterStatus);
      const q = qs.toString();
      const markets = await api("/markets" + (q ? "?" + q : ""));
      const root = document.getElementById("markets");
      if (!markets.length) {
        root.innerHTML = '<p class="muted">Пока пусто — создайте первый рынок.</p>';
        return;
      }
      root.innerHTML = markets.map(m => marketCard(m)).join("");
      await Promise.all(
        [...root.querySelectorAll(".card")].map(card => previewQuote(card))
      );
    }

    async function loadMine() {
      requireLogin();
      await refreshMe();
      requireLogin();
      const userId = me.id;
      const [markets, positions, settlements, orders] = await Promise.all([
        api("/users/" + userId + "/markets"),
        api("/users/" + userId + "/positions"),
        api("/users/" + userId + "/settlements"),
        api("/users/" + userId + "/orders")
      ]);
      await refreshMe();
      requireLogin();
      if (me.id !== userId) return;
      myPositions = {};
      for (const p of positions) myPositions[p.market_id] = p;
      document.getElementById("mine-orders").innerHTML = orders.length ? orders.map(orderCard).join("") : '<p class="muted">Заявок пока нет.</p>';
      const created = markets.filter(m => m.creator_id === me.id);
      const createdRoot = document.getElementById("mine-created");
      const betsRoot = document.getElementById("mine-bets");
      const resultsRoot = document.getElementById("mine-results");
      createdRoot.innerHTML = created.length
        ? created.map(m => marketCard(m)).join("")
        : '<p class="muted">Вы ещё не создавали рынки.</p>';
      await Promise.all(
        [...createdRoot.querySelectorAll(".card")].map(card => previewQuote(card))
      );
      const active = positions.filter(p => p.market && p.market.status !== "resolved");
      betsRoot.innerHTML = active.length
        ? active.map(positionCard).join("")
        : '<p class="muted">Ставок пока нет.</p>';
      const legacy = positions.filter(p => p.market && p.market.status === "resolved"
        && p.market.settlement_kind !== "auto");
      resultsRoot.innerHTML = settlements.length || legacy.length
        ? settlements.map(settlementCard).join("") + legacy.map(positionCard).join("")
        : '<p class="muted">Рассчитанных событий пока нет.</p>';
    }

    async function previewQuote(card) {
      if (card.dataset.mechanism === "p2p") return hydrateP2P(card);
      const preview = card.querySelector("[data-preview]");
      if (!preview) return;
      const money = Number(card.querySelector(".amount")?.value || 0);
      if (!money || money <= 0) {
        preview.textContent = "Введите сумму — покажем доли и средний коэф";
        return;
      }
      const buttons = [...card.querySelectorAll("button[data-act='buy']")];
      try {
        const quotes = await Promise.all(buttons.map(btn =>
          api("/markets/" + card.dataset.id + "/quote", {
            method: "POST",
            body: JSON.stringify({ outcome: Number(btn.dataset.outcome), money })
          })
        ));
        preview.innerHTML = quotes.map(q =>
          escapeHtml(q.outcome) + " ≈ " + q.shares.toFixed(2) + " долей · ср. коэф " + q.odds.toFixed(2)
        ).join("<br>");
      } catch (e) {
        preview.textContent = e.message;
      }
    }

    function scheduleQuote(card) {
      const id = card.dataset.id;
      clearTimeout(quoteTimers[id]);
      quoteTimers[id] = setTimeout(() => previewQuote(card), 220);
    }

    function showTab(name) {
      if (name === "moderation" && !me?.is_admin) return;
      if (name === "moderation") loadModeration().catch(e => showError(e.message));
      document.querySelectorAll("[data-panel]").forEach(p => {
        p.hidden = p.dataset.panel !== name;
      });
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.tab === name);
      });
      showError("");
      if (name === "feed") loadMarkets().catch(e => showError(e.message));
      if (name === "mine") {
        if (!me) {
          showError(inTelegram ? AUTH_REOPEN : OPEN_IN_TG);
          return;
        }
        loadMine().catch(e => showError(e.message));
      }
    }

    document.querySelector(".tabs").onclick = (ev) => {
      const btn = ev.target.closest("[data-tab]");
      if (btn) showTab(btn.dataset.tab);
    };

    document.getElementById("cat-filters").onclick = (ev) => {
      const btn = ev.target.closest("[data-cat]");
      if (!btn) return;
      filterCategory = btn.dataset.cat;
      document.querySelectorAll("#cat-filters .chip").forEach(c => c.classList.toggle("on", c === btn));
      loadMarkets().catch(e => showError(e.message));
    };

    document.getElementById("status-filters").onclick = (ev) => {
      const btn = ev.target.closest("[data-status]");
      if (!btn) return;
      filterStatus = btn.dataset.status;
      document.querySelectorAll("#status-filters .chip").forEach(c => c.classList.toggle("on", c === btn));
      loadMarkets().catch(e => showError(e.message));
    };

    document.getElementById("create-cats").onclick = (ev) => {
      const btn = ev.target.closest("[data-cat]");
      if (!btn) return;
      createCategory = btn.dataset.cat;
      document.querySelectorAll("#create-cats .chip").forEach(c => c.classList.toggle("on", c === btn));
    };

    document.getElementById("create").onclick = async () => {
      showError("");
      try {
        requireLogin();
        syncOutcomesFromDom();
        const question = document.getElementById("question").value.trim();

        const closeLocal = document.getElementById("close-at").value;
        if (question.length < 8) throw new Error("Вопрос слишком короткий");
        if (!closeLocal) throw new Error("Укажите время конца приёма");
        const closeDate = new Date(closeLocal);
        if (Number.isNaN(closeDate.getTime()) || closeDate.getTime() <= Date.now()) {
          throw new Error("Конец приёма не может быть в прошлом");
        }

        const names = createOutcomes.map(o => o.name.trim());
        if (names.some(n => !n)) throw new Error("Заполните названия исходов");
        const uniq = new Set(names.map(n => n.toLowerCase()));
        if (uniq.size !== names.length) throw new Error("Имена исходов должны быть уникальными");
        await api("/markets", {
          method: "POST",
          body: JSON.stringify({
            question,
            category: createCategory,
            description: "",
            outcomes: names,
            mechanism: "p2p",
            close_at: closeDate.toISOString(),

          })
        });
        document.getElementById("question").value = "";
        createOutcomes = [{ name: "Да", k: 2 }, { name: "Нет", k: 2 }];
        renderOutcomesEditor();
        toast("Событие отправлено на модерацию");
        await refreshMe();
        showTab("mine");
      } catch (e) { showError(e.message); }
    };

    async function onCardClick(ev) {
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const card = btn.closest(".card");
      const id = card.dataset.id;
      const amount = Number(card.querySelector(".amount")?.value || 0);
      showError("");
      try {
        requireLogin();
        if (btn.dataset.act === "p2p-refresh") { await hydrateP2P(card); return; }
        if (btn.dataset.act === "p2p-limit" || btn.dataset.act === "p2p-ioc") {
          if (card.submitting) return;
          card.submitting = true;
          try { await p2pPlace(card, btn.dataset.act === "p2p-ioc" ? "ioc" : "limit"); }
          finally { card.submitting = false; }
        } else if (btn.dataset.act === "approve" || btn.dataset.act === "reject") {
          const reason = card.querySelector(".reject-reason").value.trim();
          if (btn.dataset.act === "reject" && !reason) throw new Error("Укажите причину отклонения");
          await api("/markets/"+id+"/"+btn.dataset.act, {method:"POST", body:JSON.stringify({reason})});
          toast(btn.dataset.act === "approve" ? "Событие опубликовано" : "Событие отклонено");
        } else if (btn.dataset.act === "buy") {
          const res = await api("/markets/" + id + "/buy", {
            method: "POST",
            body: JSON.stringify({
              outcome: Number(btn.dataset.outcome),
              money: amount
            })
          });
          setBalance(res.balance);
          const avgK = res.paid > 0 ? (res.shares / res.paid) : 0;
          toast("Поставлено " + Number(res.paid).toFixed(2) + " TON, коэф ~" + avgK.toFixed(2));
        } else if (btn.dataset.act === "close") {
          if (!confirm("Остановить приём ставок?")) return;
          await api("/markets/" + id + "/close", {
            method: "POST",
            body: JSON.stringify({})
          });
          toast("Приём ставок остановлен");
        } else if (btn.dataset.act === "resolve") {
          const label = btn.dataset.label || ("исход " + btn.dataset.outcome);
          if (!confirm("Рассчитать исход «" + label + "»? Это нельзя отменить.")) return;
          await api("/markets/" + id + "/resolve", {
            method: "POST",
            body: JSON.stringify({ winning_outcome: Number(btn.dataset.outcome) })
          });
          toast("Рассчитано: " + label + " · выплаты зачислены");
        } else if (btn.dataset.act === "residual") {
          const res = await api("/markets/" + id + "/collect-residual", {
            method: "POST",
            body: JSON.stringify({})
          });
          toast("Создателю вернулось " + Number(res.returned).toFixed(2) + " TON");
        } else if (btn.dataset.act === "claim") {
          const res = await api("/markets/" + id + "/claim", {
            method: "POST",
            body: JSON.stringify({})
          });
          setBalance(res.balance);
          toast("Зачислено " + Number(res.credited).toFixed(2) + " TON · комиссия " + Number(res.tip).toFixed(2));
        }
        const panel = document.querySelector("[data-panel]:not([hidden])");
        if (panel && panel.dataset.panel === "mine") await loadMine();
        else if (panel && panel.dataset.panel === "moderation") await loadModeration();
        else await loadMarkets();
        await refreshMe();
      } catch (e) {
        showError(e.message);
        toast(e.message, true);
      }
    }

    document.getElementById("markets").onclick = onCardClick;
    document.getElementById("mine-created").onclick = onCardClick;
    document.getElementById("mine-bets").onclick = onCardClick;
    document.getElementById("mine-results").onclick = onCardClick;
    document.getElementById("moderation-markets").onclick = onCardClick;
    document.getElementById("mine-orders").onclick = async (ev) => {
      const btn = ev.target.closest("[data-cancel-order]");
      if (!btn) return;
      try {
        requireLogin();
        await api("/orders/"+btn.dataset.cancelOrder+"/cancel", {method:"POST"});
        await loadMine();
      } catch(e) { showError(e.message); }
    };
    for (const id of ["markets", "mine-created"]) {
      document.getElementById(id).addEventListener("input", ev => {
        const card = ev.target.closest('[data-mechanism="p2p"]');
        if (!card) return;
        clearTimeout(card.quoteTimer);
        card.quoteVersion = (card.quoteVersion || 0)+1;
        card.availableQuote = null;
        card.querySelector('[data-act="p2p-ioc"]').disabled = true;
        card.quoteTimer = setTimeout(() => p2pQuote(card), 250);
      });
    }

    document.getElementById("markets").addEventListener("input", (ev) => {
      if (!ev.target.classList.contains("amount")) return;
      scheduleQuote(ev.target.closest(".card"));
    });
    document.getElementById("markets").addEventListener("change", (ev) => {
      if (!ev.target.classList.contains("amount")) return;
      scheduleQuote(ev.target.closest(".card"));
    });
    document.getElementById("mine-created").addEventListener("input", (ev) => {
      if (!ev.target.classList.contains("amount")) return;
      scheduleQuote(ev.target.closest(".card"));
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !me || authBlocked) return;
      refreshMe().catch(() => {});
      const panel = document.querySelector("[data-panel]:not([hidden])");
      if (panel && panel.dataset.panel === "mine") loadMine().catch(e => showError(e.message));
      else if (panel && panel.dataset.panel === "moderation") loadModeration().catch(e => showError(e.message));
      else loadMarkets().catch(e => showError(e.message));
    });

    (async () => {
      try {
        document.getElementById("close-at").value = defaultCloseAt();
        renderOutcomesEditor();
        if (!inTelegram) {
          document.getElementById("who").textContent = OPEN_IN_TG;
          document.getElementById("create").disabled = true;
          showError(OPEN_IN_TG);
          await loadMarkets();
          return;
        }
        await auth();
        await loadMarkets();
      } catch (e) { showError(e.message); }
    })();
  </script>
</body>
</html>
